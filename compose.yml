services:
  db:
    image: lokesainathg/dockerpyapp:dbimage
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynet

  auth:
    image: lokesainathg/dockerpyapp:authimage
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynet
    depends_on:
      - db

  books:
    image: lokesainathg/dockerpyapp:bookimage
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynet
    depends_on:
      - db

  borrow:
    image: lokesainathg/dockerpyapp:borrowimage
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynet
    depends_on:
      - db

  frontend:
    image: lokesainathg/dockerpyapp:appimage
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynet
    depends_on:
      - auth
      - books
      - borrow

networks:
  mynet:
    driver: overlay
